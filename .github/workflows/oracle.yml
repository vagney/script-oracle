name: Tentar Vaga Oracle ARM

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  criar-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Preparar Chave Privada
        run: |
          echo "${{ secrets.OCI_KEY_FILE }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Executar Tentativa de Criação
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
          OCI_CLI_KEY_FILE: private_key.pem
        run: |
          echo "Iniciando tentativa na Oracle..."    
          
          # COLE O SEU COMANDO OCI COMPUTE INSTANCE LAUNCH LOGO ABAIXO:
          resposta=$(oci compute instance launch \
            --availability-domain "zYjZ:SA-VINHEDO-1-AD-1" \
            --compartment-id "SEU_COMPARTMENT_ID_AQUI" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 4, "memoryInGBs": 24}' \
            --subnet-id "SUA_SUBNET_ID_AQUI" \
            --image-id "SUA_IMAGE_ID_AQUI" \
            --assign-public-ip true \
            --display-name "Minha-Maquina-ARM" \
            --metadata '{"ssh_authorized_keys": "SUA_CHAVE_SSH_AQUI"}' 2>&1)
          
          echo "Resposta da Oracle:"
          echo "$resposta"
          
          if [[ "$resposta" == *"PROVISIONING"* || ("$resposta" == *"\"lifecycle-state\":"* && "$resposta" != *"Error"* && "$resposta" != *"ServiceError"*) ]]; then
              echo "¡SUCESSO REAL! A máquina foi aceita."
          else
              echo "Sem vagas ou erro tratado. Tentaremos novamente no próximo ciclo."
              exit 1 
          fi
